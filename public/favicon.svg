<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D17"/>
      <stop offset="50%" stop-color="#0E1B2E"/>
      <stop offset="100%" stop-color="#060D17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7A1E"/>
      <stop offset="100%" stop-color="#E6C875"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Outer gold accent ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Inner ornate gold ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" filter="url(#goldGlow)"/>

  <!-- Decorative royal stars / sparkles -->
  <path d="M 32 10 L 33 13 L 36 14 L 33 15 L 32 18 L 31 15 L 28 14 L 31 13 Z" fill="url(#goldGrad)"/>
  <path d="M 32 46 L 33 49 L 36 50 L 33 51 L 32 54 L 31 51 L 28 50 L 31 49 Z" fill="url(#goldGrad)"/>

  <!-- Monogram text MB -->
  <text 
    x="32" 
    y="38" 
    text-anchor="middle" 
    font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
    font-size="22" 
    font-weight="700" 
    letter-spacing="0.5" 
    fill="url(#goldGrad)"
    filter="url(#goldGlow)">
    MB
  </text>
</svg>

